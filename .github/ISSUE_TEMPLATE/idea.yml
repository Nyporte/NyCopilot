name: An idea
description: Something NyCopilot could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: moment
    attributes:
      label: The moment
      description: When does this come up? What are you doing, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you'd like
      description: How it would work in your words. Mock-ups welcome.
