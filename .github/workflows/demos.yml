# Records the README's moving pictures on one of GitHub's Macs, where taking over the screen for
# a minute bothers no one, and uploads them as an artifact to download into docs/images. Runs on
# request, and on pushes outside main that change the demos.
name: Demos
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - apps/macos/Tests/NyCopilotKitTests/Demo*.swift
      - .github/workflows/demos.yml

permissions:
  contents: read

jobs:
  record:
    name: Record demos
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the core for the app
        run: make core
      - name: Record
        env:
          NYCOPILOT_DEMOS: "1"
        # Optimized, so encoding keeps up with 30 frames a second.
        run: |
          cd apps/macos
          swift test -c release -Xswiftc -enable-testing --filter DemoTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos
          path: docs/images/demo-*.gif
          if-no-files-found: error
